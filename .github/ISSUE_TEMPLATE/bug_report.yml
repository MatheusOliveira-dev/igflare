name: Bug report
description: A call that fails, returns the wrong thing or throws the wrong error.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Passwords, session files, tokens, usernames and ids must be removed before pasting.
        Security problems go through the private report in SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: igflare version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: '22.12.0'
    validations:
      required: true
  - type: input
    id: call
    attributes:
      label: Call
      description: The method that fails.
      placeholder: ig.feed.user(...)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The error class and message, or the result received.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest script that shows the problem.
      render: ts
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sending
      options:
        - label: I removed passwords, tokens, session data, usernames and ids from this report.
          required: true
