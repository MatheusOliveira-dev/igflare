name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run gen:check
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm run prose
      - run: npm run guard
      - run: npm run deps
      - run: npm run dup
      - run: npm run deadcode
      - run: npm run coverage
      - run: npm run build
      - run: npm run api
      - run: npm run docs:check
      - name: Documentation site builds
        if: matrix.node == 22
        run: npm run docs

  # Pull requests are squash-merged, so the title becomes the commit on main.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint
