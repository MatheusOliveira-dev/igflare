name: release

# Stages a release on npm when a version tag is pushed. The tag must match package.json and
# the full check runs first. npm trusts this workflow through OIDC, so no token is stored,
# and a staged version goes live only after the maintainer approves it on npmjs.com with
# two-factor authentication.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing and staged releases need a newer npm than the one Node 22 ships.
      - run: npm install -g npm@12.2.2
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm run ci
      - run: npm stage publish . --provenance --access public
